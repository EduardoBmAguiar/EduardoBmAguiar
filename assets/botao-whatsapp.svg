<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="186" height="56" viewBox="0 0 186 56" role="img" aria-labelledby="titulo">
<title id="titulo">Conversar no WhatsApp</title>
<style>@font-face{font-family:G;src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}
@font-face{font-family:GM;src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}
.d{font-family:BS,'Arial Narrow',sans-serif;font-weight:900}
.s{font-family:IS,Georgia,serif;font-style:italic}
.t{font-family:G,system-ui,'Segoe UI',sans-serif}
.m{font-family:GM,ui-monospace,Consolas,monospace;letter-spacing:.12em}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes sobe{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes surge{from{opacity:0}to{opacity:1}}
@keyframes deriva{from{transform:translate(0,0)}to{transform:translate(-36px,-14px)}}
@keyframes gira{to{transform:rotate(360deg)}}
.pulso{animation:pulso 2.2s ease-in-out infinite}
.sobe{animation:sobe 1.1s cubic-bezier(.22,1,.36,1) both}
.surge{animation:surge 1.4s ease both}
.deriva{animation:deriva 22s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="moldura"><rect width="186" height="56" rx="28"/></clipPath></defs>
<g clip-path="url(#moldura)">
<rect width="186" height="56" fill="none"/>

<rect x=".75" y=".75" width="184.5" height="54.5" rx="27.25" fill="#11130e" stroke="rgba(234,229,216,.22)" stroke-width="1.5"/>
<text class="m" x="85" y="33" font-size="14" text-anchor="middle" fill="#eae5d8">WHATSAPP</text>
<text class="t" x="156" y="34" font-size="17" text-anchor="middle" fill="#ff4d1a">↗</text>
</g>
</svg>